name: oidc-debug

# TEMPORARY diagnostic. Prints the NON-secret claims GitHub puts in the identity token
# for a job in the "dev" environment. It never prints the token itself. Delete afterwards.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  show-claims:
    runs-on: ubuntu-latest
    environment: dev
    env:
      EXPECTED_SUBJECT: "repo:abhishekredd/Order-processor-infra:environment:dev"
    steps:
      - name: print identity claims
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=debug",
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "repository", "repository_owner", "environment", "ref", "event_name", "job_workflow_ref"):
              print(f"{key:18} = {claims.get(key)}")
          expected = os.environ["EXPECTED_SUBJECT"]
          print()
          print("expected by GCP    =", expected)
          print("MATCH" if claims.get("sub") == expected else "MISMATCH: the subject GitHub sends differs from what GCP trusts")
          PY